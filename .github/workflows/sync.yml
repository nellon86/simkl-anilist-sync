name: Sync Simkl → AniList

on:
  schedule:
    - cron: "17 * * * *" # cada hora, en el minuto 17 (UTC)
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Revisar toda la biblioteca de Simkl"
        type: boolean
        default: false
      dry_run:
        description: "Simular sin escribir en AniList"
        type: boolean
        default: false

permissions:
  contents: write

# Nunca dos ejecuciones a la vez: refrescar el token de Simkl en paralelo
# invalida el token de acceso de la otra ejecución.
concurrency:
  group: simkl-anilist-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sincronizar
        env:
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_REFRESH_TOKEN: ${{ secrets.SIMKL_REFRESH_TOKEN }}
          ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}
          FULL_SYNC: ${{ inputs.full_sync }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python sync.py

      # state.json solo guarda marcas de tiempo e IDs, nunca tokens.
      - name: Guardar estado
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Actualizar estado de sincronización"
            git push
          fi
